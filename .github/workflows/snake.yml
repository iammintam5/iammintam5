name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Tokyo-Night & Light Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4f46e5&color_dots=#ebedf0,#bae6fd,#38bdf8,#0284c7,#4f46e5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bf91f3&color_dots=#161b22,#1e3a5f,#2563eb,#70a5fd,#38bdae

      - name: Deploy Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
