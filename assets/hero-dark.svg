<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Huynh Minh Tam - Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glowRight" cx="78%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowLeft" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="346" rx="18" />
    </clipPath>

    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.95; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.6); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .pulse-ring {
        transform-origin: 76px 59px;
        animation: pulseDot 2.4s ease-in-out infinite;
      }
      .cursor {
        animation: blinkCursor 1.1s infinite;
      }
    </style>
  </defs>

  <!-- Main Card Container -->
  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="1196" height="346" fill="url(#bgGrad)" />
    <rect x="2" y="2" width="1196" height="346" fill="url(#grid)" />
    <rect x="2" y="2" width="1196" height="346" fill="url(#glowRight)" />
    <rect x="2" y="2" width="1196" height="346" fill="url(#glowLeft)" />
  </g>
  <rect x="2" y="2" width="1196" height="346" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
  <line x1="48" y1="2" x2="620" y2="2" stroke="url(#topLine)" stroke-width="2" />

  <!-- Status Badge -->
  <rect x="56" y="44" width="336" height="30" rx="15" fill="#0d2224" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
  <circle class="pulse-ring" cx="76" cy="59" r="6" fill="#10b981" fill-opacity="0.35" />
  <circle cx="76" cy="59" r="3.8" fill="#34d399" />
  <text x="92" y="63" class="mono" font-size="11" font-weight="600" fill="#6ee7b7" letter-spacing="0.6">OPEN TO WORK  •  HO CHI MINH CITY, VN</text>

  <!-- Name & Title -->
  <text x="56" y="130" class="sans" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-1">Huynh Minh Tam</text>

  <text x="56" y="170">
    <tspan class="sans" font-size="23" font-weight="700" fill="url(#roleGrad)" letter-spacing="-0.3">Full-Stack Developer</tspan>
    <tspan dx="12" dy="-1" class="mono" font-size="14" font-weight="500" fill="#64748b">// @iammintam5</tspan>
  </text>

  <!-- Value Proposition -->
  <text x="56" y="212" class="sans" font-size="15" font-weight="400" fill="#94a3b8">Building modular backend architectures, relational data systems, and</text>
  <text x="56" y="236" class="sans" font-size="15" font-weight="400" fill="#94a3b8">responsive type-safe web applications from concept to production.</text>

  <!-- Core Tech Stack Pills -->
  <g transform="translate(56, 272)">
    <rect x="0" y="0" width="98" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="49" y="19.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#38bdf8">TypeScript</text>

    <rect x="108" y="0" width="130" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="173" y="19.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#e2e8f0">React &amp; Next.js</text>

    <rect x="248" y="0" width="80" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="288" y="19.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f43f5e">NestJS</text>

    <rect x="338" y="0" width="104" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="390" y="19.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#818cf8">PostgreSQL</text>

    <rect x="452" y="0" width="76" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="490" y="19.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#facc15">Python</text>
  </g>

  <!-- Right Column: Code Window -->
  <g transform="translate(684, 38)">
    <!-- Shadow -->
    <rect x="4" y="6" width="464" height="274" rx="14" fill="#020617" fill-opacity="0.6" />
    <!-- Window Frame -->
    <rect x="0" y="0" width="464" height="274" rx="14" fill="#090e1a" stroke="#1e293b" stroke-width="1.5" />
    <!-- Header Divider -->
    <line x1="0" y1="38" x2="464" y2="38" stroke="#1e293b" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="22" cy="19" r="5" fill="#ef4444" fill-opacity="0.85" />
    <circle cx="38" cy="19" r="5" fill="#f59e0b" fill-opacity="0.85" />
    <circle cx="54" cy="19" r="5" fill="#10b981" fill-opacity="0.85" />

    <!-- Window Title -->
    <text x="76" y="23" class="mono" font-size="11.5" font-weight="500" fill="#64748b">engineer.config.ts</text>
    <rect x="414" y="9" width="34" height="20" rx="5" fill="#0c4a6e" fill-opacity="0.45" stroke="#0284c7" stroke-opacity="0.4" />
    <text x="431" y="23" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8">TS</text>

    <!-- Line Numbers -->
    <g class="mono" font-size="12" fill="#334155" text-anchor="end">
      <text x="32" y="66">1</text>
      <text x="32" y="89">2</text>
      <text x="32" y="112">3</text>
      <text x="32" y="135">4</text>
      <text x="32" y="158">5</text>
      <text x="32" y="181">6</text>
      <text x="32" y="204">7</text>
      <text x="32" y="227">8</text>
      <text x="32" y="250">9</text>
    </g>

    <!-- Code Content -->
    <g class="mono" font-size="12.2" font-weight="500">
      <text x="48" y="66"><tspan fill="#c084fc">export const </tspan><tspan fill="#38bdf8">profile</tspan><tspan fill="#94a3b8"> = {</tspan></text>

      <text x="66" y="89" fill="#e2e8f0">name:</text>
      <text x="118" y="89"><tspan fill="#86efac">"Huynh Minh Tam"</tspan><tspan fill="#64748b">,</tspan></text>

      <text x="66" y="112" fill="#e2e8f0">role:</text>
      <text x="118" y="112"><tspan fill="#86efac">"Full-Stack Developer"</tspan><tspan fill="#64748b">,</tspan></text>

      <text x="66" y="135" fill="#e2e8f0">web:</text>
      <text x="118" y="135"><tspan fill="#94a3b8">[</tspan><tspan fill="#7dd3fc">"React"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#7dd3fc">"Next.js"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#7dd3fc">"Tailwind"</tspan><tspan fill="#94a3b8">]</tspan><tspan fill="#64748b">,</tspan></text>

      <text x="66" y="158" fill="#e2e8f0">api:</text>
      <text x="118" y="158"><tspan fill="#94a3b8">[</tspan><tspan fill="#fda4af">"NestJS"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#fda4af">"Express"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#fda4af">"Prisma"</tspan><tspan fill="#94a3b8">]</tspan><tspan fill="#64748b">,</tspan></text>

      <text x="66" y="181" fill="#e2e8f0">data:</text>
      <text x="118" y="181"><tspan fill="#94a3b8">[</tspan><tspan fill="#c4b5fd">"PostgreSQL"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#fde047">"Python"</tspan><tspan fill="#94a3b8">]</tspan><tspan fill="#64748b">,</tspan></text>

      <text x="66" y="204" fill="#e2e8f0">arch:</text>
      <text x="118" y="204"><tspan fill="#86efac">"Clean, Modular &amp; Scalable"</tspan><tspan fill="#64748b">,</tspan></text>

      <text x="66" y="227" fill="#e2e8f0">open:</text>
      <text x="118" y="227" fill="#38bdf8">true</text>

      <text x="48" y="250"><tspan fill="#94a3b8">}</tspan><tspan fill="#c084fc"> as const</tspan><tspan fill="#64748b">;</tspan><tspan class="cursor" dx="6" fill="#38bdf8">▋</tspan></text>
    </g>
  </g>
</svg>
