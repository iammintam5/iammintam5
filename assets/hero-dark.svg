<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 236" width="860" height="236" role="img" aria-label="Huynh Minh Tam - Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11121d" />
      <stop offset="50%" stop-color="#1a1b27" />
      <stop offset="100%" stop-color="#131524" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#bf91f3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdae" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70a5fd" />
      <stop offset="50%" stop-color="#bf91f3" />
      <stop offset="100%" stop-color="#38bdae" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#bf91f3" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#70a5fd" stop-opacity="0.22" />
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdae" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#70a5fd" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdae" stop-opacity="0.18" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#bf91f3" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1a1b27" stop-opacity="0" />
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#70a5fd" fill-opacity="0.12" />
    </pattern>

    <clipPath id="heroClip">
      <rect x="1.5" y="1.5" width="857" height="233" rx="18" />
    </clipPath>

    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      @keyframes slideWave {
        0% { transform: translateX(0); }
        100% { transform: translateX(-860px); }
      }
      @keyframes slideWaveReverse {
        0% { transform: translateX(-860px); }
        100% { transform: translateX(0); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.25; transform: scale(1.75); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: translateY(0px); }
        50% { opacity: 0.85; transform: translateY(-5px); }
      }
      .w1 { animation: slideWave 11s linear infinite; }
      .w2 { animation: slideWaveReverse 15s linear infinite; }
      .pulse { transform-origin: 282px 41px; animation: pulseRing 2.4s ease-in-out infinite; }
      .p1 { animation: twinkle 3.6s ease-in-out infinite; }
      .p2 { animation: twinkle 4.4s ease-in-out 1.1s infinite; }
      .p3 { animation: twinkle 3.9s ease-in-out 2.0s infinite; }
    </style>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="1.5" y="1.5" width="857" height="233" fill="url(#bg)" />
    <rect x="1.5" y="1.5" width="857" height="233" fill="url(#dots)" />
    <rect x="1.5" y="1.5" width="857" height="233" fill="url(#centerGlow)" />

    <!-- Floating Ambient Particles -->
    <circle class="p1" cx="118" cy="64" r="2.5" fill="#70a5fd" />
    <circle class="p2" cx="748" cy="56" r="3" fill="#bf91f3" />
    <circle class="p3" cx="164" cy="148" r="2" fill="#38bdae" />
    <circle class="p1" cx="706" cy="142" r="2.2" fill="#38bdae" />
    <circle class="p2" cx="82" cy="118" r="1.8" fill="#bf91f3" />
    <circle class="p3" cx="784" cy="108" r="2" fill="#70a5fd" />

    <!-- Seamless Animated Aurora Waves -->
    <path class="w1" d="M 0 198 Q 215 174 430 198 T 860 198 Q 1075 174 1290 198 T 1720 198 L 1720 240 L 0 240 Z" fill="url(#wave1)" />
    <path class="w2" d="M 0 206 Q 215 226 430 206 T 860 206 Q 1075 226 1290 206 T 1720 206 L 1720 240 L 0 240 Z" fill="url(#wave2)" />
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1.5" y="1.5" width="857" height="233" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Live Status Pill -->
  <rect x="262" y="28" width="336" height="26" rx="13" fill="#132328" fill-opacity="0.9" stroke="#38bdae" stroke-opacity="0.45" stroke-width="1" />
  <circle class="pulse" cx="282" cy="41" r="5.5" fill="#38bdae" fill-opacity="0.4" />
  <circle cx="282" cy="41" r="3.4" fill="#38bdae" />
  <text x="438" y="45" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#73daca" letter-spacing="0.6">OPEN TO WORK  •  HO CHI MINH CITY, VN</text>

  <!-- Main Heading -->
  <text x="430" y="104" text-anchor="middle" class="sans" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">Huynh Minh Tam</text>

  <!-- Role & Handle -->
  <text x="430" y="139" text-anchor="middle">
    <tspan class="sans" font-size="20" font-weight="700" fill="url(#roleGrad)">Full-Stack Developer</tspan>
    <tspan dx="10" class="mono" font-size="13.5" font-weight="500" fill="#787c99">// @iammintam5</tspan>
  </text>

  <!-- Tagline -->
  <text x="430" y="169" text-anchor="middle" class="sans" font-size="13.5" font-weight="400" fill="#a9b1d6">
    Information Technology @ PTIT HCMC  •  Backend APIs, Modern Web &amp; Distributed Systems
  </text>
</svg>
