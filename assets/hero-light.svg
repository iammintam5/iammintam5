<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 236" width="860" height="236" role="img" aria-label="Huynh Minh Tam - Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.13" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.13" />
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.11" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.11" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.14" />
    </pattern>

    <clipPath id="heroClip">
      <rect x="1.5" y="1.5" width="857" height="233" rx="18" />
    </clipPath>

    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      @keyframes slideWave {
        0% { transform: translateX(0); }
        100% { transform: translateX(-860px); }
      }
      @keyframes slideWaveReverse {
        0% { transform: translateX(-860px); }
        100% { transform: translateX(0); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.25; transform: scale(1.75); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: translateY(0px); }
        50% { opacity: 0.8; transform: translateY(-5px); }
      }
      .w1 { animation: slideWave 11s linear infinite; }
      .w2 { animation: slideWaveReverse 15s linear infinite; }
      .pulse { transform-origin: 282px 41px; animation: pulseRing 2.4s ease-in-out infinite; }
      .p1 { animation: twinkle 3.6s ease-in-out infinite; }
      .p2 { animation: twinkle 4.4s ease-in-out 1.1s infinite; }
      .p3 { animation: twinkle 3.9s ease-in-out 2.0s infinite; }
    </style>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="1.5" y="1.5" width="857" height="233" fill="url(#bg)" />
    <rect x="1.5" y="1.5" width="857" height="233" fill="url(#dots)" />
    <rect x="1.5" y="1.5" width="857" height="233" fill="url(#centerGlow)" />

    <circle class="p1" cx="118" cy="64" r="2.5" fill="#0284c7" />
    <circle class="p2" cx="748" cy="56" r="3" fill="#6366f1" />
    <circle class="p3" cx="164" cy="148" r="2" fill="#0d9488" />
    <circle class="p1" cx="706" cy="142" r="2.2" fill="#0d9488" />

    <path class="w1" d="M 0 198 Q 215 174 430 198 T 860 198 Q 1075 174 1290 198 T 1720 198 L 1720 240 L 0 240 Z" fill="url(#wave1)" />
    <path class="w2" d="M 0 206 Q 215 226 430 206 T 860 206 Q 1075 226 1290 206 T 1720 206 L 1720 240 L 0 240 Z" fill="url(#wave2)" />
  </g>

  <rect x="1.5" y="1.5" width="857" height="233" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <rect x="262" y="28" width="336" height="26" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" />
  <circle class="pulse" cx="282" cy="41" r="5.5" fill="#10b981" fill-opacity="0.35" />
  <circle cx="282" cy="41" r="3.4" fill="#059669" />
  <text x="438" y="45" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#047857" letter-spacing="0.6">OPEN TO WORK  •  HO CHI MINH CITY, VN</text>

  <text x="430" y="104" text-anchor="middle" class="sans" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-1">Huynh Minh Tam</text>

  <text x="430" y="139" text-anchor="middle">
    <tspan class="sans" font-size="20" font-weight="700" fill="url(#roleGrad)">Full-Stack Developer</tspan>
    <tspan dx="10" class="mono" font-size="13.5" font-weight="500" fill="#64748b">// @iammintam5</tspan>
  </text>

  <text x="430" y="169" text-anchor="middle" class="sans" font-size="13.5" font-weight="400" fill="#475569">
    Information Technology @ PTIT HCMC  •  Backend APIs, Modern Web &amp; Distributed Systems
  </text>
</svg>
