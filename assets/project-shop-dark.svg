<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 198" width="420" height="198" role="img" aria-label="Modern E-Commerce Platform">
  <defs>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="417" height="195" rx="15" fill="#1a1b27" stroke="#292e42" stroke-width="1.3" />
  <line x1="22" y1="1.5" x2="175" y2="1.5" stroke="#bf91f3" stroke-width="2.2" />

  <!-- Category Pill -->
  <rect x="20" y="18" width="118" height="24" rx="12" fill="#261d3a" stroke="#bf91f3" stroke-opacity="0.35" stroke-width="1" />
  <text x="79.0" y="34" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#bf91f3" letter-spacing="0.5">WEB COMMERCE</text>

  <!-- Arrow Icon Box -->
  <rect x="372" y="16" width="28" height="28" rx="8" fill="#24283b" stroke="#292e42" stroke-width="1" />
  <path d="M382 34 L390 26 M384 26 H390 V32" fill="none" stroke="#bf91f3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Title & Description -->
  <text x="20" y="68" class="sans" font-size="17" font-weight="700" fill="#f8fafc" letter-spacing="-0.2">Modern E-Commerce Platform</text>
  <text x="20" y="93" class="sans" font-size="12.4" fill="#a9b1d6">Decoupled commerce storefront pairing a fast</text>
  <text x="20" y="112" class="sans" font-size="12.4" fill="#a9b1d6">Next.js &amp; React 19 client interface with a</text>
  <text x="20" y="131" class="sans" font-size="12.4" fill="#a9b1d6">modular Express REST API &amp; Tailwind CSS v4.</text>

  <!-- Footer Divider & Tech Meta -->
  <line x1="20" y1="150" x2="400" y2="150" stroke="#24283b" stroke-width="1" />
  <circle cx="26" cy="171" r="4.5" fill="#3178c6" />
  <text x="37" y="175" class="sans" font-size="12" font-weight="600" fill="#f8fafc">TypeScript</text>
  <text x="400" y="175" text-anchor="end" class="mono" font-size="10.8" font-weight="500" fill="#787c99">Next.js · React 19 · Tailwind · Express</text>
</svg>
