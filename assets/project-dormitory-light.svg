<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 198" width="420" height="198" role="img" aria-label="Dormitory Facility Management">
  <defs>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="417" height="195" rx="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3" />
  <line x1="22" y1="1.5" x2="175" y2="1.5" stroke="#0284c7" stroke-width="2.2" />

  <!-- Category Pill -->
  <rect x="20" y="18" width="124" height="24" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-opacity="0.35" stroke-width="1" />
  <text x="82.0" y="34" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#0284c7" letter-spacing="0.5">ENTERPRISE WEB</text>

  <!-- Arrow Icon Box -->
  <rect x="372" y="16" width="28" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <path d="M382 34 L390 26 M384 26 H390 V32" fill="none" stroke="#0284c7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Title & Description -->
  <text x="20" y="68" class="sans" font-size="17" font-weight="700" fill="#0f172a" letter-spacing="-0.2">Dormitory Facility Management</text>
  <text x="20" y="93" class="sans" font-size="12.4" fill="#475569">Asset &amp; room lifecycle platform with 3-tier RBAC</text>
  <text x="20" y="112" class="sans" font-size="12.4" fill="#475569">(Admin, Manager, Student), damage workflows,</text>
  <text x="20" y="131" class="sans" font-size="12.4" fill="#475569">QR printing, analytics charts, and audit logs.</text>

  <!-- Footer Divider & Tech Meta -->
  <line x1="20" y1="150" x2="400" y2="150" stroke="#f1f5f9" stroke-width="1" />
  <circle cx="26" cy="171" r="4.5" fill="#3178c6" />
  <text x="37" y="175" class="sans" font-size="12" font-weight="600" fill="#0f172a">TypeScript</text>
  <text x="400" y="175" text-anchor="end" class="mono" font-size="10.8" font-weight="500" fill="#64748b">NestJS · Prisma · PostgreSQL · React</text>
</svg>
