<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 138" width="860" height="138" role="img" aria-label="Core Engineering Capabilities">
  <defs>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <!-- Card 1: Backend Architecture -->
  <g transform="translate(1, 2)">
    <rect x="0" y="0" width="274" height="134" rx="14" fill="#1a1b27" stroke="#292e42" stroke-width="1.2" />
    <line x1="18" y1="0" x2="128" y2="0" stroke="#70a5fd" stroke-width="2" />
    <rect x="18" y="16" width="32" height="32" rx="8" fill="#70a5fd" fill-opacity="0.14" stroke="#70a5fd" stroke-opacity="0.35" />
    <path d="M27 27h14M27 32h14M27 37h9" stroke="#70a5fd" stroke-width="1.8" stroke-linecap="round" />
    <text x="256" y="36" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#70a5fd" letter-spacing="0.5">01 // BACKEND</text>
    <text x="18" y="72" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Backend Architecture</text>
    <text x="18" y="95" class="sans" font-size="12.2" fill="#a9b1d6">Modular NestJS &amp; Express APIs,</text>
    <text x="18" y="114" class="sans" font-size="12.2" fill="#a9b1d6">JWT/RBAC security &amp; audit logs.</text>
  </g>

  <!-- Card 2: Modern Web Frontend -->
  <g transform="translate(293, 2)">
    <rect x="0" y="0" width="274" height="134" rx="14" fill="#1a1b27" stroke="#292e42" stroke-width="1.2" />
    <line x1="18" y1="0" x2="128" y2="0" stroke="#bf91f3" stroke-width="2" />
    <rect x="18" y="16" width="32" height="32" rx="8" fill="#bf91f3" fill-opacity="0.14" stroke="#bf91f3" stroke-opacity="0.35" />
    <path d="M31 28l-4 4 4 4M37 28l4 4-4 4" fill="none" stroke="#bf91f3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="256" y="36" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#bf91f3" letter-spacing="0.5">02 // FRONTEND</text>
    <text x="18" y="72" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Modern Web Interfaces</text>
    <text x="18" y="95" class="sans" font-size="12.2" fill="#a9b1d6">Type-safe React &amp; Next.js apps,</text>
    <text x="18" y="114" class="sans" font-size="12.2" fill="#a9b1d6">Tailwind UI &amp; live analytics.</text>
  </g>

  <!-- Card 3: Data & Distributed Systems -->
  <g transform="translate(585, 2)">
    <rect x="0" y="0" width="274" height="134" rx="14" fill="#1a1b27" stroke="#292e42" stroke-width="1.2" />
    <line x1="18" y1="0" x2="128" y2="0" stroke="#38bdae" stroke-width="2" />
    <rect x="18" y="16" width="32" height="32" rx="8" fill="#38bdae" fill-opacity="0.14" stroke="#38bdae" stroke-opacity="0.35" />
    <ellipse cx="34" cy="27" rx="7" ry="3" fill="none" stroke="#38bdae" stroke-width="1.6" />
    <path d="M27 27v10c0 1.7 3.1 3 7 3s7-1.3 7-3V27" fill="none" stroke="#38bdae" stroke-width="1.6" />
    <text x="256" y="36" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#38bdae" letter-spacing="0.5">03 // DATA &amp; DB</text>
    <text x="18" y="72" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Data &amp; Query Systems</text>
    <text x="18" y="95" class="sans" font-size="12.2" fill="#a9b1d6">PostgreSQL + Prisma schemas &amp;</text>
    <text x="18" y="114" class="sans" font-size="12.2" fill="#a9b1d6">Python distributed DB optimizers.</text>
  </g>
</svg>
